<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f1a">
    <title>Biografi</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://script.google.com">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f0f1a; }
        iframe { border: none; width: 100%; height: 100%; position: absolute; inset: 0; background: #0f0f1a; }
        #loader { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0f0f1a; color: #c4b5fd; font: 14px -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 0 24px; transition: opacity .25s; }
        .spin { width: 34px; height: 34px; border: 3px solid #4c1d95; border-top-color: #a78bfa; border-radius: 50%; animation: putar .8s linear infinite; }
        @keyframes putar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <iframe id="bioFrame"></iframe>
    <div id="loader"><div class="spin"></div><div id="loaderTeks">Memuat...</div></div>

    <script>
        const baseUrl = "https://script.google.com/macros/s/AKfycby1XauCHcP8WKdwqfxgYRXNsQM0-4paIagN3SHJ_lzUX3lkJ7V9D0IhoUXJhAofTaX1LA/exec";
        const params  = window.location.search;                       // "" atau "?nama=sensen"
        const nama    = new URLSearchParams(params).get("nama");

        const frame  = document.getElementById("bioFrame");
        const loader = document.getElementById("loader");

        document.getElementById("loaderTeks").textContent =
            nama ? "Sedang mempersiapkan CV " + nama + "..." : "Memuat...";

        // Bersihkan salinan lama dari versi sebelumnya (kalau ada)
        try {
            Object.keys(localStorage)
                .filter(function (k) { return k.indexOf("cvSnap:") === 0; })
                .forEach(function (k) { localStorage.removeItem(k); });
        } catch (e) {}

        // Muat halaman asli (hanya satu kali)
        frame.src = baseUrl + params;

        let siapSudah = false;
        function siap() {
            if (siapSudah) return;
            siapSudah = true;
            loader.style.opacity = "0";
            setTimeout(function () { loader.style.display = "none"; }, 250);
        }

        // Layar loading hilang begitu CV memberi kabar siap, atau saat iframe selesai dimuat
        frame.addEventListener("load", function () { setTimeout(siap, 300); });
        setTimeout(siap, 12000);   // jaring pengaman

        window.addEventListener("message", function (e) {
            try {
                if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
            } catch (err) { return; }
            if (e.data && e.data.type === "cv-ready") siap();
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("Service Worker Terdaftar!"))
                .catch(err => console.log("Gagal:", err));
        }
    </script>
</body>
</html>
